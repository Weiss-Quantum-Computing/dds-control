<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1700" viewBox="0 0 680 1700" role="img"><title>Microwave chain levels, as built</title><desc>Power in dBm and Vpp at each point of the microwave chain as built on 13 Nov 2026: AWG path padded by 29 dB, gated by the ZYSWA then the ZSWA, amplified by a ZX60-P103LN+ and injected into the uW DDS chain; with measured scope readings, damage limits and compression points.</desc>
