<text class="ts" x="40" y="1597" dominant-baseline="central">Right of each arrow: uW DDS at 5.187 (full scale). Left: AWG at 5 Vpp, its 60 MHz max.</text>
<text class="ts" x="40" y="1617" dominant-baseline="central">"meas." = scope reading on 13 Nov; "both" = DDS and AWG read the same there.</text>
<text class="ts" x="40" y="1637" dominant-baseline="central">Third line in each box: damage limit (dmg) or 1 dB compression (P1dB), datasheet dBm.</text>
<text class="ts" x="40" y="1657" dominant-baseline="central">Amber: within ~2.5 dB of compression at full output. Mixer onward estimated;</text>
<text class="ts" x="40" y="1677" dominant-baseline="central">AM53 compression to be checked with atoms (Rabi frequency vs AWG amplitude).</text>
